# API Endpoints Configuration
# All API endpoints defined in one place

endpoints:
  users:
    getAll: /users
    getById: /users/{id}
    create: /users
    update: /users/{id}
    delete: /users/{id}
    search: /users/search

  orders:
    getAll: /orders
    getById: /orders/{id}
    create: /orders
    update: /orders/{id}
    delete: /orders/{id}
    cancel: /orders/{id}/cancel

  products:
    getAll: /products
    getById: /products/{id}
    create: /products
    update: /products/{id}
    delete: /products/{id}
    search: /products/search

  auth:
    login: /auth/login
    logout: /auth/logout
    refresh: /auth/refresh
    signup: /auth/signup