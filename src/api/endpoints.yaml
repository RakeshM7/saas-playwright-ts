# Freshsales API Endpoints Configuration
# All Freshsales CRM API endpoints defined in one place

endpoints:
  contacts:
    getAll: /contacts
    getById: /contacts/{id}
    create: /contacts
    update: /contacts/{id}
    delete: /contacts/{id}
    search: /search?q={query}&include=contact 
    getActivities: /contacts/{id}/activities
    getDeals: /contacts/{id}/deals
    convertToAccount: /contacts/{id}/convert_to_account
    upsert: /contacts/upsert