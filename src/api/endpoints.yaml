# Freshsales API Endpoints Configuration
# All Freshsales CRM API endpoints defined in one place

endpoints:
  contacts:
    getAll: /api/contacts
    getById: /api/contacts/{id}
    create: /api/contacts
    update: /api/contacts/{id}
    delete: /api/contacts/{id}
    search: /api/search?q={query}&include=contact 
    getActivities: /api/contacts/{id}/activities
    getDeals: /api/contacts/{id}/deals
    convertToAccount: /api/contacts/{id}/convert_to_account
    upsert: /api/contacts/upsert